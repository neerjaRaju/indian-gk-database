name: Generate and release question drafts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-question-drafts
  cancel-in-progress: false

jobs:
  generate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore previous category questions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/generated
          PREVIOUS_TAG="$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == true and (.tagName | startswith("ai-draft-")))] | .[0].tagName // empty')"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "No previous AI-draft release; starting new category files."
            exit 0
          fi
          echo "Restoring accumulated category questions from $PREVIOUS_TAG"
          while IFS= read -r category; do
            gh release download "$PREVIOUS_TAG" \
              --pattern "${category}.json" \
              --dir data/generated
          done < <(python -c 'import json; print("\n".join(item["id"] for item in json.load(open("config/categories.json", encoding="utf-8"))))')

      - name: Generate every category
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUESTION_COUNT: "10"
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r category; do
            echo "Generating ${QUESTION_COUNT} bilingual pairs for ${category}"
            python scripts/generate_questions.py \
              --category "$category" \
              --count "$QUESTION_COUNT"
            sleep 4
          done < <(python -c 'import json; print("\n".join(item["id"] for item in json.load(open("config/categories.json", encoding="utf-8"))))')

      - name: Validate all generated records
        run: |
          python scripts/validate_database.py --include-generated
          python scripts/verify_sources.py
          pytest -q

      - name: Build combined database
        env:
          DATABASE_VERSION: ai-draft-${{ github.sha }}
        run: python scripts/build_database.py --include-generated

      - name: Publish category files as a draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUESTION_COUNT: "10"
        shell: bash
        run: |
          set -euo pipefail
          TAG="ai-draft-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            data/generated/*.json \
            dist/category-*.json \
            dist/questions.en.json \
            dist/questions.hi.json \
            dist/questions.sqlite3 \
            dist/questions.json.gz \
            dist/manifest.json \
            --prerelease \
            --title "AI-generated bilingual question drafts $TAG" \
            --notes "Generated ${QUESTION_COUNT} English/Hindi question pairs for every configured category. These are AI-generated drafts; verify facts, citations, licenses, and translations before production use."